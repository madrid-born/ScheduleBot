# Bootstrap HTTP configuration. Certbot adds the certificate and HTTPS redirect.
# The existing schedulebot.service listens on http://localhost:5002.
# If this domain already has a Certbot site, copy the location settings into that
# domain's existing HTTPS server block instead of enabling a second site.
server {
    listen 80;
    listen [::]:80;
    server_name telegramdownload.kofi.rest;

    # Download paths contain bearer tokens; avoid recording them in request/error logs.
    access_log off;
    error_log /var/log/nginx/telegramdownload.error.log crit;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_ignore_client_abort off;
        proxy_next_upstream off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
    }
}
